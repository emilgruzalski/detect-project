name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - run: bun run package
      - name: Verify dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'bun run package' and commit the result."
            git status --porcelain dist/
            exit 1
          fi

  # Runs the action through `uses: ./` on a real runner, once per scenario. Every scenario
  # declares its inputs and the outputs it expects; only the keys listed in `expected` are checked.
  # (`bun run test:e2e` covers the same scenarios locally, without pushing.)
  e2e:
    name: E2E (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: node-pnpm
            working-directory: __tests__/fixtures/node-pnpm
            fail-on-unknown: true
            expected:
              language: node
              version: '1.2.3'
              package-manager: pnpm
              package-manager-version: '9.12.0'
              language-version: '20.18.0'
              language-version-file: __tests__/fixtures/node-pnpm/.nvmrc
              version-major: '1'
              is-prerelease: 'false'
              workspace-root: __tests__/fixtures/node-pnpm
              install-command: pnpm install --frozen-lockfile
              cache-dependency-path: __tests__/fixtures/node-pnpm/pnpm-lock.yaml
          - name: python-poetry
            working-directory: __tests__/fixtures/python-poetry
            fail-on-unknown: true
            expected:
              language: python
              version: '4.5.6'
              package-manager: poetry
              package-manager-version: '1.8.4'
              language-version: '^3.11'
              language-version-source: pyproject.toml:tool.poetry.dependencies.python
              language-version-file: __tests__/fixtures/python-poetry/pyproject.toml
              install-command: poetry install
              cache-dependency-path: __tests__/fixtures/python-poetry/poetry.lock
          - name: go-module
            working-directory: __tests__/fixtures/go-module
            fail-on-unknown: true
            expected:
              language: go
              version: '7.8.9'
              package-manager: go
              package-manager-version: '1.22.7'
              language-version: '1.22.0'
              language-version-file: __tests__/fixtures/go-module/go.mod
              install-command: go mod download
              cache-dependency-path: __tests__/fixtures/go-module/go.sum
          - name: node workspace member
            working-directory: __tests__/fixtures/node-workspace/apps/api
            fail-on-unknown: true
            expected:
              language: node
              version: '2.1.0-rc.1'
              version-major: '2'
              version-minor: '1'
              version-patch: '0'
              version-prerelease: rc.1
              is-prerelease: 'true'
              package-manager: pnpm
              package-manager-version: '10.4.1'
              language-version: '22.11.0'
              language-version-source: ../../.nvmrc
              language-version-file: __tests__/fixtures/node-workspace/.nvmrc
              lockfile: ../../pnpm-lock.yaml
              workspace-root: __tests__/fixtures/node-workspace
              install-command: pnpm install --frozen-lockfile
              cache-dependency-path: __tests__/fixtures/node-workspace/pnpm-lock.yaml
          - name: mixed, language-priority go
            working-directory: __tests__/fixtures/mixed
            language-priority: go
            expected:
              language: go
              languages: '["go","node"]'
          - name: missing working-directory
            working-directory: does-not-exist
            expect-failure: true
            expected: {}
          - name: mixed, auto
            working-directory: __tests__/fixtures/mixed
            expected:
              language: node
              languages: '["node","go"]'
          - name: mixed, forced go
            working-directory: __tests__/fixtures/mixed
            language: go
            expected:
              language: go
              name: example.com/mixed
          - name: unknown
            working-directory: .github
            expected:
              language: unknown
          - name: unknown, fail-on-unknown
            working-directory: .github
            fail-on-unknown: true
            expect-failure: true
            expected:
              language: unknown
    steps:
      - uses: actions/checkout@v7
      - id: detect
        uses: ./
        continue-on-error: ${{ matrix.expect-failure || false }}
        with:
          working-directory: ${{ matrix.working-directory }}
          language: ${{ matrix.language || 'auto' }}
          language-priority: ${{ matrix.language-priority || '' }}
          fail-on-unknown: ${{ matrix.fail-on-unknown || false }}
      - name: Assert outputs
        env:
          EXPECTED: ${{ toJSON(matrix.expected) }}
          ACTUAL: ${{ toJSON(steps.detect.outputs) }}
          EXPECTED_OUTCOME: ${{ matrix.expect-failure && 'failure' || 'success' }}
          OUTCOME: ${{ steps.detect.outcome }}
        run: |
          fail=0
          if [ "$EXPECTED_OUTCOME" != "$OUTCOME" ]; then
            echo "::error::step outcome: expected '$EXPECTED_OUTCOME', got '$OUTCOME'"
            fail=1
          fi
          for key in $(echo "$EXPECTED" | jq -r 'keys[]'); do
            expected=$(echo "$EXPECTED" | jq -r ".\"$key\"")
            actual=$(echo "$ACTUAL" | jq -r ".\"$key\"")
            # `languages` is the full detection result; compare only the detected language list.
            if [ "$key" = languages ]; then
              actual=$(echo "$actual" | jq -c '[.[].language]')
            fi
            if [ "$expected" != "$actual" ]; then
              echo "::error::$key: expected '$expected', got '$actual'"
              fail=1
            else
              echo "$key = $actual ✔"
            fi
          done
          exit $fail
