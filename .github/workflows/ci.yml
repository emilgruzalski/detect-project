name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - run: bun run package
      - name: Verify dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'bun run package' and commit the result."
            git status --porcelain dist/
            exit 1
          fi

  # The e2e scenarios live in __tests__/e2e-scenarios.json, shared with `bun run test:e2e`.
  scenarios:
    name: Load e2e scenarios
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: __tests__/e2e-scenarios.json
          sparse-checkout-cone-mode: false
      - id: load
        run: echo "matrix=$(jq -c . __tests__/e2e-scenarios.json)" >> "$GITHUB_OUTPUT"

  # Runs the action through `uses: ./` on a real runner, once per scenario. Every scenario
  # declares its inputs and the outputs it expects; only the keys listed in `expected` are checked.
  e2e:
    name: E2E (${{ matrix.name }})
    needs: [build, scenarios]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scenarios.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        uses: ./
        continue-on-error: ${{ matrix.expect-failure || false }}
        with:
          working-directory: ${{ matrix.working-directory }}
          language: ${{ matrix.language || 'auto' }}
          language-priority: ${{ matrix.language-priority || '' }}
          tag-pattern: ${{ matrix.tag-pattern || '' }}
          discover: ${{ matrix.discover || false }}
          discover-max-depth: ${{ matrix.discover-max-depth || '3' }}
          discover-exclude: ${{ matrix.discover-exclude || '' }}
          fail-on-unknown: ${{ matrix.fail-on-unknown || false }}
      - name: Assert outputs
        env:
          EXPECTED: ${{ toJSON(matrix.expected) }}
          ACTUAL: ${{ toJSON(steps.detect.outputs) }}
          EXPECTED_OUTCOME: ${{ matrix.expect-failure && 'failure' || 'success' }}
          OUTCOME: ${{ steps.detect.outcome }}
        run: |
          fail=0
          if [ "$EXPECTED_OUTCOME" != "$OUTCOME" ]; then
            echo "::error::step outcome: expected '$EXPECTED_OUTCOME', got '$OUTCOME'"
            fail=1
          fi
          for key in $(echo "$EXPECTED" | jq -r 'keys[]'); do
            expected=$(echo "$EXPECTED" | jq -r ".\"$key\"")
            actual=$(echo "$ACTUAL" | jq -r ".\"$key\"")
            # `languages` / `projects` carry full results; compare only the language list / project directories.
            if [ "$key" = languages ] && [ -n "$actual" ]; then
              actual=$(echo "$actual" | jq -c '[.[].language]')
            elif [ "$key" = projects ] && [ -n "$actual" ]; then
              actual=$(echo "$actual" | jq -c '[.[].directory]')
            fi
            if [ "$expected" != "$actual" ]; then
              echo "::error::$key: expected '$expected', got '$actual'"
              fail=1
            else
              echo "$key = $actual ✔"
            fi
          done
          exit $fail
