name: 'Detect Project'
description: 'Detects language, version, package manager and runtime: Node, Python, Go, Rust, Dart/Flutter, Ruby, PHP, .NET, Java'
author: 'Emil Gruzalski'

branding:
  icon: 'search'
  color: 'blue'

inputs:
  working-directory:
    description: 'Directory to inspect, relative to the workspace root. The step fails if it does not exist.'
    required: false
    default: '.'
  language:
    description: 'Only consider this language: auto, node, python, go, rust, dart (incl. Flutter), ruby, php, dotnet or java (Maven/Gradle).'
    required: false
    default: 'auto'
  language-priority:
    description: 'Languages to prefer as primary when a directory has several, comma separated (e.g. "python,node").'
    required: false
    default: ''
  tag-pattern:
    description: 'git describe --match globs for the git-tag version fallback, comma or newline separated (e.g. "release-*", "api@v*").'
    required: false
    default: ''
  discover:
    description: 'Also inspect subdirectories and report every project in the "projects" output (JSON for a matrix).'
    required: false
    default: 'false'
  discover-max-depth:
    description: 'How many directory levels below working-directory discover inspects (0-10).'
    required: false
    default: '3'
  discover-exclude:
    description: 'Globs relative to working-directory that discover skips, comma or newline separated (e.g. "examples, legacy/**").'
    required: false
    default: ''
  fail-on-unknown:
    description: 'Fail the step when no supported project is found (with discover: neither in working-directory nor below it).'
    required: false
    default: 'false'

outputs:
  language:
    description: 'Primary language: node, python, go, rust, dart, ruby, php, dotnet, java or unknown.'
  name:
    description: 'Project name from the manifest (package name, module path, artifactId, ...).'
  manifest:
    description: 'Manifest the detection is based on, relative to working-directory.'
  version:
    description: 'Application version; empty when nothing declares one.'
  version-source:
    description: 'Where the version came from, e.g. package.json, pyproject.toml:project.version, git-tag.'
  version-major:
    description: 'Major version component.'
  version-minor:
    description: 'Minor version component, 0 when absent.'
  version-patch:
    description: 'Patch version component, 0 when absent.'
  version-prerelease:
    description: 'Pre-release identifier (rc.1, beta2, dev3); empty for final releases.'
  version-build:
    description: 'Build metadata after "+" (27 in 1.4.0+27).'
  is-prerelease:
    description: 'true when the version has a pre-release identifier, otherwise false.'
  package-manager:
    description: 'Package manager or build tool: npm, pnpm, yarn, bun, pip, uv, poetry, pdm, pipenv, hatch, go, dep, cargo, dart, flutter, bundler, composer, dotnet, maven, gradle.'
  package-manager-version:
    description: 'Package manager version when declared (packageManager, wrapper, BUNDLED WITH, ...); for pnpm and Yarn otherwise the major implied by the lockfile.'
  lockfile:
    description: 'Lockfile relative to working-directory (the workspace root''s for workspace members); empty when none.'
  install-command:
    description: 'Dependency install command (npm ci, uv sync --locked, cargo fetch --locked, ...) to run in workspace-root; empty when there is no safe default.'
  workspace-root:
    description: 'Directory to install dependencies from, relative to the workspace root: the monorepo root for workspace members, else working-directory.'
  cache-dependency-path:
    description: 'File for the setup actions'' cache-dependency-path, relative to the workspace root; empty when none.'
  language-version:
    description: 'Runtime version or constraint as written (.nvmrc, requires-python, go directive, rust-toolchain, global.json, ...).'
  language-version-source:
    description: 'Where language-version came from, relative to working-directory (e.g. package.json:engines.node, ../../.nvmrc).'
  language-version-file:
    description: 'That file relative to the workspace root, only when the setup action reads the same value from it (node-version-file, java-version-file, ...); else empty.'
  languages:
    description: 'JSON array with the full result for every language found in the directory.'
  projects:
    description: 'With discover: JSON array with one entry per project directory (directory, languages, primary result); [] otherwise.'

runs:
  using: node24
  main: dist/index.js
